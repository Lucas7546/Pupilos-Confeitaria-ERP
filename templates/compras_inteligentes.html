{% extends "base.html" %}

{% block content %}

<div class="text-center mb-5">
    <h1 class="fw-bold text-warning">
        🤖 Compras Inteligentes da Lumenarch Solutions
    </h1>

    <p class="text-white-50">
        Tire uma foto ou envie uma nota fiscal para atualização automática do estoque
    </p>
</div>

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card bg-dark border-0 shadow-lg">

            <div class="card-body p-5">

                <form
                    action="{{ url_for('compras.processar_nota') }}"
                    method="POST"
                    enctype="multipart/form-data"
                    id="formOCR">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">

                    <div class="mb-4">

                        <label class="form-label text-white fw-bold">
                            📷 Foto da Nota Fiscal
                        </label>

                        <input
                            type="file"
                            name="foto_nota"
                            accept="image/*"
                            capture="environment"
                            class="form-control"
                            id="fotoNota"
                            required>

                    </div>

                    <div class="text-center mb-4">

                        <img
                            id="preview"
                            class="img-fluid rounded shadow d-none"
                            style="max-height:400px;">

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning w-100 py-3 fw-bold"
                        id="btnOCR">

                        🧠 Ler Nota Fiscal

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
