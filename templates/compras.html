{% extends "base.html" %}

{% block content %}
<div class="container py-5 animate-in">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-white">Entrada de Mercadorias</h2>
                <p class="text-white-50">Atualize o estoque e custo médio</p>
            </div>

            <div class="card bg-dark-card border-0 shadow-lg rounded-4 overflow-hidden mb-4">
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('insumos.rota_registrar_compra') }}" method="POST" id="formCompra">
                        
                        <div class="mb-4">
                            <label class="form-label text-white-50 fw-bold small text-uppercase">Ingrediente:</label>
                            <select name="id_materia_prima" id="selectInsumo" class="form-select form-select-lg bg-dark text-white border-secondary" required>
                                <option value="" disabled selected>Selecione o ingrediente...</option>
                                {% for m in materias %}
                                    <option value="{{ m[0] }}" data-unidade="{{ m[2] }}" data-custo="{{ m[6] }}">
                                        {{ m[1] }} (Atual: R$ {{ m[6] }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-white-50 fw-bold small text-uppercase">Quantidade:</label>
                                <div class="d-flex gap-2 mb-2">
                                    <button type="button" class="btn btn-sm btn-outline-warning" onclick="addQtd(1)">+1</button>
                                    <button type="button" class="btn btn-sm btn-outline-warning" onclick="addQtd(5)">+5</button>
                                    <button type="button" class="btn btn-sm btn-outline-warning" onclick="addQtd(10)">+10</button>
                                </div>
                                <div class="input-group input-group-lg">
                                    <input type="number" step="0.001" name="quantidade" id="inputQtd" class="form-control bg-dark text-white" placeholder="0.000" required>
                                    <span class="input-group-text bg-secondary text-white" id="unitLabel">un</span>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label text-white-50 fw-bold small text-uppercase">Valor Total (R$):</label>
                                <div class="input-group input-group-lg">
                                    <input type="number" step="0.01" name="preco_total" id="inputPreco" class="form-control bg-dark text-white" placeholder="0,00" required>
                                </div>
                            </div>
                        </div>

                        <div class="bg-black bg-opacity-25 rounded-3 p-3 mb-4 text-center">
                            <span class="text-white-50 small">Custo Unitário Estimado:</span>
                            <div class="text-success fw-bold fs-4" id="previewCusto">R$ 0,00</div>
                            <div id="avisoPreco" class="mt-2 text-warning fw-bold small"></div>
                        </div>

                        <button type="submit" id="btnSubmit" class="btn btn-success btn-lg w-100 fw-bold py-3">PROCESSAR ENTRADA</button>
                    </form>
                </div>
            </div>

            <div class="mt-4">
                <h5 class="text-white mb-3">Últimas Entradas</h5>
                <div class="list-group" id="listaHistorico">
                    {% for c in ultimas_compras %}
                    <div class="list-group-item bg-dark border-secondary text-white-50 d-flex justify-content-between">
                        <span>{{ c[1] }}</span>
                        <span>Qtd: {{ c[2] }} - R$ {{ c[4] }}</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-dark-card { background: #1e293b !important; }
    .form-control, .form-select { border: 1px solid #334155 !important; }
    .form-control:focus { border-color: #f59e0b !important; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2) !important; }
    .animate-in { animation: fadeInScale 0.4s ease-out; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
</style>

<script>
    const form = document.getElementById('formCompra');
    const inputQtd = document.getElementById('inputQtd');
    const inputPreco = document.getElementById('inputPreco');
    const selectInsumo = document.getElementById('selectInsumo');
    const previewCusto = document.getElementById('previewCusto');
    const avisoPreco = document.getElementById('avisoPreco');

    function addQtd(valor) {
        inputQtd.value = (parseFloat(inputQtd.value || 0) + valor).toFixed(3);
        calcularPreview();
    }

    function calcularPreview() {
        const qtd = parseFloat(inputQtd.value) || 0;
        const preco = parseFloat(inputPreco.value) || 0;
        const opt = selectInsumo.options[selectInsumo.selectedIndex];
        const custoAnterior = parseFloat(opt.dataset.custo) || 0;

        if (qtd > 0 && preco > 0) {
            const unit = preco / qtd;
            previewCusto.textContent = `R$ ${unit.toFixed(2)}`;
            
            // Alerta de variação de preço
            if (custoAnterior > 0) {
                const variacao = ((unit - custoAnterior) / custoAnterior) * 100;
                avisoPreco.textContent = Math.abs(variacao) > 30 
                    ? `⚠️ Atenção: Preço ${variacao > 0 ? 'acima' : 'abaixo'} ${Math.abs(variacao).toFixed(0)}% do normal!` 
                    : "";
            }
        } else {
            previewCusto.textContent = "R$ 0,00";
            avisoPreco.textContent = "";
        }
    }

    inputQtd.addEventListener('input', calcularPreview);
    inputPreco.addEventListener('input', calcularPreview);
    selectInsumo.addEventListener('change', (e) => {
        document.getElementById('unitLabel').textContent = e.target.options[e.target.selectedIndex].dataset.unidade;
        calcularPreview();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.textContent = "PROCESSANDO...";

        try {
            const response = await fetch(form.action, { method: 'POST', body: new FormData(form) });
            if (response.ok) {
                alert("Entrada registrada com sucesso!");
                window.location.reload(); // Recarrega para atualizar os saldos reais do banco
            } else {
                alert("Erro ao salvar no banco de dados.");
            }
        } catch (err) {
            alert("Erro de conexão.");
        } finally {
            btn.disabled = false;
            btn.textContent = "PROCESSAR ENTRADA";
        }
    });
</script>
{% endblock %}
