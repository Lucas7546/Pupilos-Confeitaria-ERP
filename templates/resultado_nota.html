{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card bg-dark text-white border-0 shadow-lg rounded-4">
        <div class="card-body p-4">
            <h2 class="fw-bold text-warning mb-4">🧠 Conferir Itens Detectados</h2>
            <p class="text-white-50 mb-4">Confira se os dados da nota estão corretos antes de confirmar a entrada no estoque.</p>
            
            <form action="/confirmar-nota" method="POST">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Quantidade</th>
                                <th>Valor Unit.</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for item in itens %}
                            <tr>
                                <td>
                                    <input type="text" name="nome_{{ loop.index0 }}" value="{{ item.produto }}" class="form-control bg-secondary text-white border-0" required>
                                </td>
                                <td>
                                    <input type="number" step="0.01" name="qtd_{{ loop.index0 }}" value="{{ item.quantidade }}" class="form-control bg-secondary text-white border-0" required>
                                </td>
                                <td>
                                    <input type="number" step="0.01" name="preco_{{ loop.index0 }}" value="{{ item.valor_unitario }}" class="form-control bg-secondary text-white border-0" required>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                
                <input type="hidden" name="total_itens" value="{{ itens|length }}">
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold shadow">
                        ✅ Confirmar e Adicionar ao Estoque
                    </button>
                    <a href="/compras-inteligentes" class="btn btn-link text-white-50 w-100 mt-2">Voltar e cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
