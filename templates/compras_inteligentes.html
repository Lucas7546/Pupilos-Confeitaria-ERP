{% extends "base.html" %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card bg-dark text-white shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    
                    <h1 class="fw-bold mb-3">
                        <i class="bi bi-robot"></i> 🧠 Compras Inteligentes
                    </h1>
                    <p class="text-white-50 mb-4">
                        Capture a nota fiscal ou o comprovante. A Inteligência de compras identificará os itens e atualizará o seu estoque automático.
                    </p>

                    <form id="formProcessamento" action="/processar-nota" method="POST" enctype="multipart/form-data">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Foto da Nota Fiscal</label>
                            <input 
                                type="file" 
                                name="foto_nota" 
                                id="foto_nota"
                                accept="image/*" 
                                capture="environment" 
                                class="form-control form-control-lg bg-secondary text-white border-0" 
                                required
                            >
                        </div>

                        <div id="previewContainer" class="mb-4 text-center d-none">
                            <img id="imgPreview" src="#" alt="Preview" class="img-fluid rounded shadow" style="max-height: 300px;">
                        </div>

                        <button type="submit" id="btnSubmit" class="btn btn-warning w-100 fw-bold py-3 rounded-3 shadow">
                            <span id="btnText">📸 Processar Nota com IA</span>
                            <span id="btnLoading" class="d-none">
                                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                Analisando nota...
                            </span>
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Preview da imagem antes do envio
    document.getElementById('foto_nota').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.getElementById('imgPreview');
                img.src = event.target.result;
                document.getElementById('previewContainer').classList.remove('d-none');
            }
            reader.readAsDataURL(file);
        }
    });

    // Feedback de carregamento no botão
    document.getElementById('formProcessamento').addEventListener('submit', function() {
        const btn = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        
        btn.disabled = true;
        btnText.classList.add('d-none');
        btnLoading.classList.remove('d-none');
    });
</script>

{% endblock %}
