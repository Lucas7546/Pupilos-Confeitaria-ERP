{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>🏠 Cadastro rápido</h2>

    <form action="/cadastrar-mp" method="POST">
        <input name="nome" placeholder="Nome">
        <input name="unidade" placeholder="Unidade">
        <input name="minimo" placeholder="Estoque mínimo">
        <input name="preco" placeholder="Preço">

        <button type="submit">Cadastrar</button>
    </form>
</div>

<div class="card">
    <h2>🧁 Vender produto</h2>

    <form action="/vender" method="POST">
        <input name="nome_produto" placeholder="Nome do produto">
        <input name="quantidade" placeholder="Quantidade">
        <input name="preco" placeholder="Preço">

        <button type="submit">Vender</button>
    </form>
</div>

{% endblock %}
