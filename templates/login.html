<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ EMPRESA|upper }}</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-deep: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7); /* Ajustado para melhor contraste */
            --accent-gold: #f59e0b;
            --text-muted: #94a3b8;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            padding: 20px; /* Previne que o card encoste na borda no celular */
        }

        /* Efeito de Estrelas/Partículas no Fundo */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                      radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        /* Glow e melhorias no card */
        .login-box {
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
            /* Adiciona um brilho sutil ao redor do card */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                0 0 30px rgba(245, 158, 11, 0.1);
        }

        .login-box::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 29px;
            background: linear-gradient(135deg, var(--accent-gold), transparent, transparent);
            z-index: -1;
            opacity: 0.3;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: rgba(245, 158, 11, 0.1);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        h2 {
            text-align: center;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 5px;
        }

        .sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-label {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group-text {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 0 12px 12px 0;
            padding: 12px;
        }

        .form-control:focus {
            border-color: var(--accent-gold) !important;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            color: #000;
            margin-top: 15px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.5);
            filter: brightness(1.1);
        }

        .btn-login:active { transform: translateY(0); }

        .forgot-link {
            color: var(--accent-gold);
            font-size: 0.75rem;
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .alert-success {
            background: rgba(34,197,94,.15);
            border: 1px solid rgba(34,197,94,.25);
            color: #4ade80;
        }

        .alert-danger,
        .alert-error {
            background: rgba(239,68,68,.15);
            border: 1px solid rgba(239,68,68,.25);
            color: #f87171;
        }

        .alert-warning {
            background: rgba(245,158,11,.15);
            border: 1px solid rgba(245,158,11,.25);
            color: #fbbf24;
        }
        .input-group .input-group-text:last-child {
            border-radius: 0 12px 12px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-circle">
            <i class="bi bi-stars" style="color: var(--accent-gold);"></i>
        </div>

        <h2>{{ EMPRESA|upper }}</h2>
        <p class="sub">Painel Administrativo</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} d-flex align-items-center mb-4">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <div>{{ message }}</div>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label mb-2">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" autofocus name="username" class="form-control" placeholder="admin_pupilos" required autocomplete="username">
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label mb-0">Senha</label>
                    <a href="#" class="forgot-link text-decoration-none">
                        <i class="bi bi-shield-check me-1"></i>Acesso Seguro
                    </a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="input-group-text" onclick="toggleSenha()">
                        <i class="bi bi-eye" id="iconeSenha"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Acessar Painel <i class="bi bi-chevron-right ms-1"></i>
            </button>
        </form>

        <footer class="mt-5 text-center">
            <p class="text-white-50 m-0" style="font-size: 0.65rem; opacity: 0.5;">
                &copy; <span id="ano"></span> {{ EMPRESA }}<br>
                Ambiente Seguro para Gestão de Insumos
            </p>
        </footer>
    </div>

    <script>
function toggleSenha() {

    const senha = document.getElementById("senha");
    const icone = document.getElementById("iconeSenha");

    if (senha.type === "password") {
        senha.type = "text";
        icone.classList.remove("bi-eye");
        icone.classList.add("bi-eye-slash");
    } else {
        senha.type = "password";
        icone.classList.remove("bi-eye-slash");
        icone.classList.add("bi-eye");
    }
}
</script>
<script>
document.querySelector("form").addEventListener("submit", function() {

    const btn = document.getElementById("btnLogin");

    btn.disabled = true;
    btn.style.pointerEvents = "none";

    btn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';
});
</script>
<script>
document.getElementById("ano").innerText =
    new Date().getFullYear();
</script>
</body>
</html>
