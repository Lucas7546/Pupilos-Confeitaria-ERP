{% extends "base.html" %}
{% block content %}
<div class="container py-5 animate-in">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-white">Entrada de Mercadorias</h2>
            </div>

            <div class="card bg-dark border-0 shadow-lg rounded-4 p-4 p-md-5">
                <form action="{{ url_for('insumos.rota_registrar_compra') }}" method="POST" id="formCompra">
                    <div class="mb-4">
                        <label class="text-secondary fw-bold small text-uppercase">Ingrediente</label>
                        <select name="id_materia_prima" id="selectInsumo" class="form-select bg-dark text-white border-secondary" required>
                            <option value="" disabled selected>Selecione...</option>
                            {% for m in materias %}
                                <option value="{{ m[0] }}" data-unidade="{{ m[2] }}" data-custo="{{ m[6] }}">
                                    {{ m[1] }} (Atual: {{ m[4] }}{{ m[2] }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="text-secondary fw-bold small text-uppercase">Quantidade</label>
                            <div class="input-group">
                                <input type="number" step="0.001" name="quantidade" id="inputQtd" class="form-control bg-dark text-white" required>
                                <span class="input-group-text bg-secondary text-white border-0" id="unitLabel">un</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="text-secondary fw-bold small text-uppercase">Valor Total (R$)</label>
                            <input type="number" step="0.01" name="preco_total" id="inputPreco" class="form-control bg-dark text-white" required>
                        </div>
                    </div>

                    <div class="mt-4 p-3 bg-black bg-opacity-25 rounded text-center">
                        <div class="text-white-50 small">Novo Custo Unitário:</div>
                        <div class="fs-4 fw-bold text-success" id="previewCusto">R$ 0,00</div>
                        <div id="avisoPreco" class="mt-2 text-warning fw-bold small"></div>
                    </div>

                    <button type="submit" id="btnSubmit" class="btn btn-success w-100 mt-4 py-3 fw-bold">PROCESSAR ENTRADA</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const select = document.getElementById('selectInsumo');
    const inputQtd = document.getElementById('inputQtd');
    const inputPreco = document.getElementById('inputPreco');
    const previewCusto = document.getElementById('previewCusto');
    const avisoPreco = document.getElementById('avisoPreco');

    function calcular() {
        const qtd = parseFloat(inputQtd.value) || 0;
        const preco = parseFloat(inputPreco.value) || 0;
        const opt = select.options[select.selectedIndex];
        const custoAnterior = parseFloat(opt.dataset.custo) || 0;

        if (qtd > 0 && preco > 0) {
            const unit = preco / qtd;
            previewCusto.textContent = `R$ ${unit.toFixed(2).replace('.', ',')}`;
            
            // Lógica do Alerta (30% de variação)
            if (custoAnterior > 0) {
                const variacao = ((unit - custoAnterior) / custoAnterior) * 100;
                avisoPreco.textContent = Math.abs(variacao) > 30 
                    ? `⚠️ Atenção: Preço ${variacao > 0 ? 'acima' : 'abaixo'} ${Math.abs(variacao).toFixed(0)}% do normal!` 
                    : "";
            }
        } else {
            previewCusto.textContent = "R$ 0,00";
            avisoPreco.textContent = "";
        }
    }

    [inputQtd, inputPreco].forEach(el => el.addEventListener('input', calcular));
    select.addEventListener('change', (e) => {
        document.getElementById('unitLabel').textContent = e.target.options[e.target.selectedIndex].dataset.unidade;
        calcular();
    });

    document.getElementById('formCompra').addEventListener('submit', async (e) => {
        e.preventDefault();
        const response = await fetch("{{ url_for('insumos.rota_registrar_compra') }}", { 
            method: 'POST', 
            body: new FormData(e.target) 
        });
        if (response.ok) {
            alert("Sucesso!");
            e.target.reset();
            previewCusto.textContent = "R$ 0,00";
        } else {
            alert("Erro ao registrar.");
        }
    });
</script>
{% endblock %}
