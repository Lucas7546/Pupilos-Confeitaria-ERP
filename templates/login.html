<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ EMPRESA|upper }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">

    <style>
        :root {
            --bg-deep: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            /* Variáveis que o JS vai alternar */
            --accent-primary: #f59e0b; 
            --accent-shadow: rgba(245, 158, 11, 0.3);
        }

        /* Classes de Tema */
        .tema-azul    { --accent-primary: #38bdf8; --accent-shadow: rgba(56, 189, 248, 0.3); }
        .tema-laranja { --accent-primary: #f59e0b; --accent-shadow: rgba(245, 158, 11, 0.3); }
        .tema-verde   { --accent-primary: #22c55e; --accent-shadow: rgba(34, 197, 94, 0.3); }
        .tema-roxo    { --accent-primary: #a855f7; --accent-shadow: rgba(168, 85, 247, 0.3); }
        .tema-vermelho{ --accent-primary: #ef4444; --accent-shadow: rgba(239, 68, 68, 0.3); }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .login-box::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 29px;
            background: linear-gradient(135deg, var(--accent-primary), transparent, transparent);
            z-index: -1;
            opacity: 0.3;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .logo-circle {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            color: var(--accent-primary);
        }

        h2 { text-align: center; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 5px; }
        .sub { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        .form-label { color: #94a3b8; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

        .input-group-text {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-primary);
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 0 12px 12px 0;
            padding: 12px;
        }

        .form-control:focus {
            border-color: var(--accent-primary) !important;
            box-shadow: 0 0 0 4px var(--accent-shadow);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent-primary), #d97706);
            border: none; width: 100%; padding: 14px; border-radius: 12px;
            font-weight: 700; color: #000; margin-top: 15px;
            transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px var(--accent-shadow); filter: brightness(1.1); }

        .forgot-link { color: var(--accent-primary); font-size: 0.75rem; text-decoration: none; font-weight: 600; }

        /* Estilos de Alerta */
        .alert { border-radius: 12px; font-size: 0.85rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; }
        .alert-success { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.25); color: #4ade80; }
        .alert-warning { background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.25); color: #fbbf24; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-circle"><i class="bi bi-stars"></i></div>
        <h2>{{ EMPRESA|upper }}</h2>
        <p class="sub">Painel Administrativo</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} d-flex align-items-center mb-4">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <div>{{ message }}</div>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label mb-2">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" autofocus name="username" class="form-control" placeholder="admin" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label mb-0">Senha</label>
                    <a href="#" class="forgot-link"><i class="bi bi-shield-check me-1"></i>Acesso Seguro</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="input-group-text" style="border-radius:0 12px 12px 0" onclick="toggleSenha()">
                        <i class="bi bi-eye" id="iconeSenha"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">Acessar Painel <i class="bi bi-chevron-right ms-1"></i></button>
        </form>

        <footer class="mt-5 text-center">
            <p class="text-white-50 m-0" style="font-size: 0.65rem; opacity: 0.5;">
                &copy; <span id="ano"></span> {{ EMPRESA }}<br>
                Ambiente Seguro para Gestão de Insumos
            </p>
        </footer>
    </div>

    <script>
        // Força a execução imediata e garante a troca da cor
        (function() {
            const temas = ['tema-azul', 'tema-laranja', 'tema-verde', 'tema-roxo', 'tema-vermelho'];
            const corAleatoria = temas[Math.floor(Math.random() * temas.length)];
            document.body.classList.add(corAleatoria);
            
            // Define o ano
            document.getElementById("ano").innerText = new Date().getFullYear();
            
            console.log("Tema carregado:", corAleatoria); // Isso ajuda a ver no console do navegador se trocou
        })();

        function toggleSenha() {
            const senha = document.getElementById("senha");
            const icone = document.getElementById("iconeSenha");
            senha.type = (senha.type === "password") ? "text" : "password";
            icone.className = (senha.type === "password") ? "bi bi-eye" : "bi bi-eye-slash";
        }

        document.querySelector("form").addEventListener("submit", function() {
            const btn = document.getElementById("btnLogin");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';
        });
    </script>
</body>
</html>
